<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Cnpj</title>
</head>
<body>
    <form id="uploadForm">
        <input type="file" id="pdfFile" accept="application/pdf" />
        <br><br>
        <button type="submit">Enviar PDF</button>
    </form>
    
    <div id="resultado">
        <!-- Aqui os dados vão aparecer -->
    </div>
    
    <script>
        const form = document.getElementById("uploadForm");

        form.addEventListener("submit", function (e) {
            e.preventDefault(); // impede recarregar a página

            const input = document.getElementById("pdfFile");
            const file = input.files[0];

            if (!file) {
                alert("Escolha um arquivo PDF!");
                return;
            }

            const formData = new FormData();
            formData.append("pdf", file); // "pdf" precisa bater com o nome usado no multer

            fetch("http://localhost:3000/upload", {
                method: "POST",
                body: formData,
            })
            .then((response) => response.json())
            .then((data) => {
                console.log("✅ Dados recebidos:", data);
                mostrarResultado(data); // função que mostra os dados
            })
            .catch((error) => {
                console.error("Erro:", error);
            });
        });

        function mostrarResultado(dados) {
            const div = document.getElementById("resultado");
            div.innerHTML = ""; // limpa antes

            for (const chave in dados) {
                const valor = dados[chave];
                const p = document.createElement("p");
                p.textContent = `${chave}: ${valor}`;
                div.appendChild(p);
            }
        }
    </script>
</body>
</html>
